name: waternudge
description: "WaterNudge"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get:
  sqflite: ^2.4.2
  fl_chart: ^0.70.2
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.21
  intl: ^0.20.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  fluttertoast: ^9.0.0
  in_app_review: ^2.0.10
  shared_preferences: ^2.3.5
  country_flags: ^3.0.0
  device_region: ^1.1.1
  flutter_slidable: ^3.1.1
  dsp_base:
    path: ./dsp_base

  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  package_info_plus: any
  google_sign_in: ^6.2.2
  audioplayers: ^6.6.0
  image_picker: ^1.1.2
  # Calls server_gateway_ai from the AI chat screen.
  http: ^1.6.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  pedantic_mono: any

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/png/logo_app_v4.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/webp/
    - assets/images/svg/
    - assets/images/png/
    - assets/images/cup_type/
    - assets/images/menu/
    - assets/audio/
    - lib/xml_strings/values/
    - lib/xml_strings/values-ar/
    - lib/xml_strings/values-de/
    - lib/xml_strings/values-es/
    - lib/xml_strings/values-fa/
    - lib/xml_strings/values-fr/
    - lib/xml_strings/values-id/
    - lib/xml_strings/values-it/
    - lib/xml_strings/values-ja/
    - lib/xml_strings/values-ko/
    - lib/xml_strings/values-pt/
    - lib/xml_strings/values-ru/
    - lib/xml_strings/values-tr/
    - lib/xml_strings/values-vi/
    - lib/xml_strings/values-zh-rCN/
    - lib/xml_strings/values-zh-rTW/
    

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
