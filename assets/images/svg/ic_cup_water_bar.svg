<svg width="490" height="616" viewBox="0 0 490 616" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Glass -->
  <linearGradient id="glassBody" x1="78" y1="95" x2="420" y2="540" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E9F7FF" stop-opacity="0.82"/>
    <stop offset="0.38" stop-color="#BFE4FF" stop-opacity="0.45"/>
    <stop offset="0.7" stop-color="#DDF2FF" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#9FD5FA" stop-opacity="0.55"/>
  </linearGradient>

  <linearGradient id="glassStroke" x1="60" y1="78" x2="430" y2="570" gradientUnits="userSpaceOnUse">
    <stop stop-color="#66A8DB"/>
    <stop offset="0.55" stop-color="#F9FDFF"/>
    <stop offset="1" stop-color="#69A9D8"/>
  </linearGradient>

  <!-- Water -->
  <linearGradient id="waterBody" x1="130" y1="250" x2="355" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#51B8F8"/>
    <stop offset="0.5" stop-color="#3AA7EF"/>
    <stop offset="1" stop-color="#2E97E2"/>
  </linearGradient>

  <linearGradient id="waterSurface" x1="100" y1="245" x2="390" y2="305" gradientUnits="userSpaceOnUse">
    <stop stop-color="#54BFFD"/>
    <stop offset="0.55" stop-color="#5FC4FB"/>
    <stop offset="1" stop-color="#46B0F3"/>
  </linearGradient>

  <linearGradient id="baseGlass" x1="100" y1="475" x2="385" y2="585" gradientUnits="userSpaceOnUse">
    <stop stop-color="#DDF2FF" stop-opacity="0.6"/>
    <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#8CC7EF" stop-opacity="0.65"/>
  </linearGradient>

  <clipPath id="glassClip">
    <path d="M70 108
             C76 170 83 284 90 408
             C94 485 105 535 125 557
             C147 580 344 580 366 557
             C386 535 397 485 401 408
             C408 284 415 170 421 108
             Z"/>
  </clipPath>
</defs>

<!-- Outer glass body -->
<path d="M70 108
         C76 170 83 284 90 408
         C94 485 105 535 125 557
         C147 580 344 580 366 557
         C386 535 397 485 401 408
         C408 284 415 170 421 108
         Z"
      fill="url(#glassBody)"
      stroke="url(#glassStroke)"
      stroke-width="8"
      stroke-linejoin="round"/>

<!-- Top opening -->
<ellipse cx="245.5" cy="108" rx="176.5" ry="34"
         fill="#EAF6FF" fill-opacity="0.45"
         stroke="#68A8D7" stroke-width="7"/>

<ellipse cx="245.5" cy="108" rx="163" ry="24"
         fill="#F7FCFF" fill-opacity="0.36"/>

<!-- Water clipped inside glass -->
<g clip-path="url(#glassClip)">
  <!-- Water body -->
  <path d="M94 270
           C95 326 98 395 102 450
           C105 486 114 502 127 510
           C153 527 337 527 363 510
           C376 502 385 486 388 450
           C392 395 395 326 396 270
           Z"
        fill="url(#waterBody)"/>

  <!-- Water top -->
  <ellipse cx="245" cy="270" rx="151" ry="31"
           fill="url(#waterSurface)"/>

  <!-- Dark thin water rim -->
  <path d="M96 270
           C115 292 371 292 394 270"
        stroke="#178DDF" stroke-width="8" stroke-linecap="round" opacity="0.92"/>

  <!-- Water lower soft ellipse -->
  <ellipse cx="245" cy="490" rx="126" ry="25"
           fill="#248DD8" fill-opacity="0.32"/>

  <!-- Right inner glass reflection -->
  <path d="M345 120
           C351 194 350 311 341 423
           C338 465 329 492 319 509
           L350 507
           C364 485 371 453 374 410
           C382 298 388 192 391 124
           Z"
        fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Left inner light -->
  <path d="M108 157
           C114 228 119 352 124 409
           C126 432 130 439 139 439"
        stroke="white" stroke-width="25"
        stroke-linecap="round" opacity="0.82"/>

  <!-- Fine left sheen -->
  <path d="M91 124 C97 215 104 360 111 434"
        stroke="#DFF4FF" stroke-width="7"
        stroke-linecap="round" opacity="0.82"/>
</g>

<!-- Glass lower/base overlay -->
<path d="M101 467
         C109 515 117 540 134 553
         C155 569 335 569 356 553
         C373 540 381 515 389 467
         C376 498 359 513 338 522
         C308 536 182 536 152 522
         C131 513 114 498 101 467Z"
      fill="url(#baseGlass)" opacity="0.85"/>

<!-- Inner bottom ellipse -->
<ellipse cx="245" cy="504" rx="91" ry="15"
         fill="#A6D9F8" fill-opacity="0.38"
         stroke="#D8F1FF" stroke-opacity="0.55" stroke-width="3"/>

<!-- Bottom rim -->
<ellipse cx="245" cy="556" rx="113" ry="19"
         fill="#D8F0FF" fill-opacity="0.38"
         stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="7"/>

<!-- Front lower glass highlight -->
<path d="M118 497
         C130 532 146 546 172 552"
      stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.8"/>

<!-- Small water highlight -->
<path d="M321 282 C340 279 356 274 367 268"
      stroke="#DDF5FF" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

<!-- Outer vertical edge highlights -->
<path d="M78 122 C84 233 89 368 98 452"
      stroke="#EAF8FF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M413 122 C407 233 402 368 393 452"
      stroke="#D7F0FF" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
</svg>
